name: Build Android (Release APK + AAB)

on:
  push:
    branches: [main, develop, release/**]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_bundle:
        description: 'Build AAB (Play Store)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44'
  FLUTTER_CHANNEL: 'stable'

jobs:
  build:
    name: Analyze + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-android-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-android-

      - name: Install dependencies
        run: flutter pub get

      - name: Create environment file
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL || 'https://api.example.com/api' }}" > .env
          echo "APP_NAME=wedding" >> .env

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test
        timeout-minutes: 15

      - name: Decode Android keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          echo "storeFile=$(pwd)/android/app/keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties

      - name: Build APK (release — fat)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build APK (release — split per ABI)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build AppBundle (release)
        if: github.event.inputs.build_bundle != 'false'
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Report artifacts
        run: |
          echo '## 📦 Build output' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          ls -lh build/app/outputs/bundle/release/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 30

  release:
    name: GitHub Release (tags)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-artifacts

      - name: Generate release notes
        run: |
          echo "## 🚀 Release ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          git log --pretty=format:'- %s (%h)' $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD)..HEAD --first-parent 2>/dev/null >> release-notes.md || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: release-artifacts/**
          generate_release_notes: true