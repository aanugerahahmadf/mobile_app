name: Discord Notification

on:
  push:
    branches:
      - main
      - chore/complete-mobile-tests-and-chat
      - dependabot/npm_and_yarn/functions/npm_and_yarn-a18cab04ac
      - v0/mobile-fullstack-ci
  pull_request:
    types: [opened, closed, reopened]
    branches:
      - main
      - chore/complete-mobile-tests-and-chat
      - v0/mobile-fullstack-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-discord:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="ðŸš€ Git Push to \`${BRANCH}\`"
          DESCRIPTION="**Repository:** [${REPO}](https://github.com/${REPO})\\n**Author:** ${ACTOR}\\n**Message:** ${COMMIT_MSG}"
          COLOR=3066993

          if [ "$EVENT_NAME" = "pull_request" ]; then
            TITLE="ðŸ“  Pull Request ${BRANCH}"
            DESCRIPTION="**Repository:** [${REPO}](https://github.com/${REPO})\\n**Author:** ${ACTOR}\\n**PR:** ${{ github.event.pull_request.html_url }}"
            COLOR=15105570
          fi

          PAYLOAD=$(cat <<EOF
          {
            "username": "GitHub CI/CD Bot",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [
              {
                "title": "${TITLE}",
                "url": "${COMMIT_URL}",
                "description": "${DESCRIPTION}",
                "color": ${COLOR},
                "footer": {
                  "text": "Wedding Flowers Decoration App â€¢ GitHub Actions"
                },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
