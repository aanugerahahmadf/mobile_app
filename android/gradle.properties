org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -Dfile.encoding=UTF-8
# Wajib pakai JDK 27 (bukan JBR/Android Studio JDK). Path JDK di-set lewat
# GRADLE_USER_HOME/gradle.properties di mesin lokal agar CI (setup-java) tetap jalan.
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.warning.mode=none

kotlin.jvm.target.validation.mode=IGNORE
