# ============================================================
# COMPLEX TRANSACTION MUTATIONS
# ============================================================

mutation CreateWeddingWithVenue(
  $weddingTitle: String!,
  $weddingDate: Date!,
  $budgetLimit: Float,
  $themeColorPalette: String,
  $venueName: String!
) @auth(level: USER) @transaction {
  createdWedding: wedding_insert(
    data: {
      title: $weddingTitle,
      weddingDate: $weddingDate,
      budgetLimit: $budgetLimit,
      themeColorPalette: $themeColorPalette
    }
  ) {
    id
    title
    weddingDate
  }
  createdVenue: venueArea_insert(
    data: {
      name: $venueName,
      weddingId: _expr: "response.createdWedding.id"
    }
  ) {
    id
    name
  }
}

mutation CreateArrangementWithFlowers(
  $arrangementName: String!,
  $arrangementType: String!,
  $status: String!,
  $weddingId: UUID!,
  $flowers: [FlowerItemInsertInput!]!
) @auth(level: USER) @transaction {
  createdArrangement: arrangement_insert(
    data: {
      name: $arrangementName,
      type: $arrangementType,
      status: $status,
      weddingId: $weddingId
    }
  ) {
    id
    name
    type
    status
  }
  createdFlowers: flowerItem_insertMany(
    data: _expr: "response.createdArrangement.id"
  ) {
    count
  }
}
