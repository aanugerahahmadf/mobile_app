# ============================================================
# WEDDING MUTATIONS - Comprehensive CRUD Operations
# ============================================================

# --- Wedding Mutations ---

mutation CreateWedding(
  $title: String!,
  $weddingDate: Date!,
  $budgetLimit: Float,
  $themeColorPalette: String
) @auth(level: USER) {
  wedding_insert(
    data: {
      title: $title,
      weddingDate: $weddingDate,
      budgetLimit: $budgetLimit,
      themeColorPalette: $themeColorPalette
    }
  ) {
    id
    title
    weddingDate
    budgetLimit
    themeColorPalette
  }
}

mutation UpdateWedding(
  $id: UUID!,
  $title: String,
  $weddingDate: Date,
  $budgetLimit: Float,
  $themeColorPalette: String
) @auth(level: USER) {
  wedding_update(
    key: { id: $id },
    data: {
      title: $title,
      weddingDate: $weddingDate,
      budgetLimit: $budgetLimit,
      themeColorPalette: $themeColorPalette
    }
  ) {
    id
    title
    weddingDate
    budgetLimit
    themeColorPalette
  }
}

mutation DeleteWedding($id: UUID!) @auth(level: USER) {
  wedding_delete(key: { id: $id }) {
    keys
  }
}

mutation UpsertWedding(
  $id: UUID!,
  $title: String!,
  $weddingDate: Date!,
  $budgetLimit: Float,
  $themeColorPalette: String
) @auth(level: USER) {
  wedding_upsert(
    key: { id: $id },
    object: {
      title: $title,
      weddingDate: $weddingDate,
      budgetLimit: $budgetLimit,
      themeColorPalette: $themeColorPalette
    }
  ) {
    id
    title
    weddingDate
    budgetLimit
    themeColorPalette
  }
}

# --- Arrangement Mutations ---

mutation CreateArrangement(
  $name: String!,
  $type: String!,
  $status: String!,
  $weddingId: UUID!,
  $estimatedCost: Float,
  $actualCost: Float,
  $notes: String,
  $venueAreaId: UUID
) @auth(level: USER) {
  arrangement_insert(
    data: {
      name: $name,
      type: $type,
      status: $status,
      weddingId: $weddingId,
      estimatedCost: $estimatedCost,
      actualCost: $actualCost,
      notes: $notes,
      venueAreaId: $venueAreaId
    }
  ) {
    id
    name
    type
    status
    estimatedCost
    actualCost
    notes
  }
}

mutation UpdateArrangement(
  $id: UUID!,
  $name: String,
  $type: String,
  $status: String,
  $estimatedCost: Float,
  $actualCost: Float,
  $notes: String,
  $venueAreaId: UUID
) @auth(level: USER) {
  arrangement_update(
    key: { id: $id },
    data: {
      name: $name,
      type: $type,
      status: $status,
      estimatedCost: $estimatedCost,
      actualCost: $actualCost,
      notes: $notes,
      venueAreaId: $venueAreaId
    }
  ) {
    id
    name
    type
    status
    estimatedCost
    actualCost
    notes
  }
}

mutation DeleteArrangement($id: UUID!) @auth(level: USER) {
  arrangement_delete(key: { id: $id }) {
    keys
  }
}

mutation UpdateArrangementStatus($id: UUID!, $status: String!) @auth(level: USER) {
  arrangement_update(key: { id: $id }, data: { status: $status }) {
    id
    name
    status
  }
}

# --- VenueArea Mutations ---

mutation CreateVenueArea($name: String!, $weddingId: UUID!) @auth(level: USER) {
  venueArea_insert(data: { name: $name, weddingId: $weddingId }) {
    id
    name
  }
}

mutation UpdateVenueArea($id: UUID!, $name: String) @auth(level: USER) {
  venueArea_update(key: { id: $id }, data: { name: $name }) {
    id
    name
  }
}

mutation DeleteVenueArea($id: UUID!) @auth(level: USER) {
  venueArea_delete(key: { id: $id }) {
    keys
  }
}

# --- FlowerItem Mutations ---

mutation CreateFlowerItem(
  $name: String!,
  $color: String!,
  $arrangementId: UUID!,
  $seasonAvailability: String,
  $costPerStem: Float
) @auth(level: USER) {
  flowerItem_insert(
    data: {
      name: $name,
      color: $color,
      arrangementId: $arrangementId,
      seasonAvailability: $seasonAvailability,
      costPerStem: $costPerStem
    }
  ) {
    id
    name
    color
    seasonAvailability
    costPerStem
  }
}

mutation UpdateFlowerItem(
  $id: UUID!,
  $name: String,
  $color: String,
  $seasonAvailability: String,
  $costPerStem: Float
) @auth(level: USER) {
  flowerItem_update(
    key: { id: $id },
    data: {
      name: $name,
      color: $color,
      seasonAvailability: $seasonAvailability,
      costPerStem: $costPerStem
    }
  ) {
    id
    name
    color
    seasonAvailability
    costPerStem
  }
}

mutation DeleteFlowerItem($id: UUID!) @auth(level: USER) {
  flowerItem_delete(key: { id: $id }) {
    keys
  }
}

mutation BulkCreateFlowerItems(
  $items: [FlowerItemInsertInput!]!
) @auth(level: USER) {
  flowerItem_insertMany(data: $items) {
    count
  }
}

