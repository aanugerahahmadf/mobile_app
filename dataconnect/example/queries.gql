mutation InsertWedding @auth(level: USER) {
  wedding_insert(data: { title: "My Wedding", weddingDate: "2025-10-10" })
}

mutation UpdateWedding($id: UUID!, $title: String) @auth(level: USER) {
  wedding_update(key: { id: $id }, data: { title: $title })
}

mutation DeleteWedding($id: UUID!) @auth(level: USER) {
  wedding_delete(key: { id: $id })
}

query GetWedding($id: UUID!) @auth(level: USER) {
  wedding(id: $id) { title weddingDate budgetLimit }
}

query ListWeddings @auth(level: USER) {
  weddings { title weddingDate }
}

mutation InsertArrangement($name: String!, $type: String!, $status: String!, $weddingId: UUID!) @auth(level: USER) {
